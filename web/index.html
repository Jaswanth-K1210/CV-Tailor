<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV Tailor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="engine-banner" class="banner hidden"></div>

  <header>
    <div class="header-left">
      <h1>CV Tailor</h1>
      <span id="engine-badge" class="engine-badge"></span>
    </div>
    <div class="header-right">
      <span id="usage-pill" class="usage-pill"></span>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <section id="step-input" class="card">
    <h2><span class="step-num">1</span> Your details</h2>
    <label>Your current CV</label>
    <div id="cv-dropzone" class="dropzone">
      <div class="dropzone-inner">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Drop PDF, DOCX, or TXT here</span>
        <span class="dropzone-sub">or</span>
        <button id="upload-btn" class="btn btn-secondary btn-sm">Browse files</button>
      </div>
    </div>
    <div id="cv-file-info" class="file-info hidden">
      <span id="cv-filename"></span>
      <button id="cv-clear" class="icon-btn icon-btn-sm" title="Remove file">&times;</button>
    </div>
    <label>Your CV (paste text, or use upload above)</label>
    <textarea id="cv" rows="10" placeholder="Paste your CV here..."></textarea>

    <label>Job posting URL</label>
    <div class="row">
      <input id="url" type="text" placeholder="https://boards.greenhouse.io/..." />
      <button id="fetch-btn" class="btn btn-secondary">Fetch JD</button>
    </div>

    <label>Job description (auto-filled, or paste manually)</label>
    <textarea id="jd" rows="8" placeholder="Paste the job description here..."></textarea>

    <button id="generate-btn" class="btn btn-primary">Generate tailored CV</button>
  </section>

  <section id="step-result" class="card hidden">
    <h2><span class="step-num">2</span> Draft and ATS score</h2>
    <div id="score-box"></div>
    <p class="note">ATS score is an estimate based on keyword coverage and formatting. Not an official employer score.</p>
    <div id="external-score-box"></div>
    <textarea id="draft" rows="16"></textarea>

    <label>Comments or changes (optional)</label>
    <textarea id="feedback" rows="3" placeholder="e.g. emphasize leadership, shorten summary..."></textarea>

    <div class="row">
      <button id="regen-btn" class="btn btn-secondary">Regenerate with feedback</button>
      <button id="export-btn" class="btn btn-primary">Approve and export PDF</button>
    </div>
    <div id="export-msg" class="note"></div>
  </section>

  <div id="settings-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="settings-close" class="icon-btn icon-btn-sm">&times;</button>
      </div>
      <div class="modal-body">
        <label>AI Engine</label>
        <div id="engine-list" class="engine-list"></div>

        <label for="settings-model">Model</label>
        <input id="settings-model" type="text" placeholder="e.g. sonnet, gemini-2.5-flash" />

        <div class="modal-actions">
          <button id="test-engine-btn" class="btn btn-secondary">Test connection</button>
          <div class="modal-actions-right">
            <button id="settings-cancel" class="btn btn-secondary">Cancel</button>
            <button id="settings-save" class="btn btn-primary">Save</button>
          </div>
        </div>
        <div id="test-result" class="test-result hidden"></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="overlay-msg">Working...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
